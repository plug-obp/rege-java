plugins {
    id 'java'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(23))
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    withJavadocJar()
    withSourcesJar()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'org.obpcdl'
            artifactId = 'reader-infra'
            // Version inherited from root project

            from components.java

            pom {
                name = 'Reader Infrastructure'
                description = 'Reusable parsing infrastructure with Result Monad, position tracking, and alien syntax validation'
                url = 'https://github.com/plug-obp/rege-java'
                
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                
                developers {
                    developer {
                        id = 'plug-obp'
                        name = 'OBPCDL'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/plug-obp/rege-java.git'
                    developerConnection = 'scm:git:ssh://github.com/plug-obp/rege-java.git'
                    url = 'https://github.com/plug-obp/rege-java'
                }
            }
        }
    }
    
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/${System.getenv("GITHUB_REPOSITORY") ?: "plug-obp/rege-java"}")
            credentials {
                username = System.getenv("GITHUB_ACTOR")
                password = System.getenv("GITHUB_TOKEN")
            }
        }
    }
}
